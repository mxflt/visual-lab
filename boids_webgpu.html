<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Boids Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 12px;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 280px;
            pointer-events: auto;
            /* Enable interaction */
            -webkit-user-select: none;
            user-select: none;
        }

        h3 {
            margin: 0 0 10px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            margin: 0 0 15px 0;
            font-size: 0.9em;
            color: #aaa;
        }

        .control-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85em;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            width: 100%;
            accent-color: #00d2ff;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="controls">
        <h3>WebGPU Boids</h3>
        <p>Particles: 6000</p>

        <div class="control-group">
            <label>Speed <span id="val-deltaT">0.02</span></label>
            <input type="range" id="deltaT" min="0.001" max="0.1" step="0.001" value="0.02">
        </div>

        <div class="control-group">
            <label>Separation Radius <span id="val-rule1Distance">0.05</span></label>
            <input type="range" id="rule1Distance" min="0.01" max="0.2" step="0.01" value="0.05">
        </div>
        <div class="control-group">
            <label>Separation Force <span id="val-rule1Scale">0.05</span></label>
            <input type="range" id="rule1Scale" min="0.0" max="0.2" step="0.001" value="0.05">
        </div>

        <div class="control-group">
            <label>Alignment Radius <span id="val-rule2Distance">0.30</span></label>
            <input type="range" id="rule2Distance" min="0.01" max="0.5" step="0.01" value="0.3">
        </div>
        <div class="control-group">
            <label>Alignment Force <span id="val-rule2Scale">0.20</span></label>
            <input type="range" id="rule2Scale" min="0.0" max="0.5" step="0.001" value="0.2">
        </div>

        <div class="control-group">
            <label>Cohesion Radius <span id="val-rule3Distance">0.30</span></label>
            <input type="range" id="rule3Distance" min="0.01" max="0.5" step="0.01" value="0.3">
        </div>
        <div class="control-group">
            <label>Cohesion Force <span id="val-rule3Scale">0.05</span></label>
            <input type="range" id="rule3Scale" min="0.0" max="0.2" step="0.001" value="0.05">
        </div>

        <div class="control-group" style="margin-top: 15px; border-top: 1px solid #444; padding-top: 10px;">
            <button id="colorModeBtn"
                style="width: 100%; padding: 8px; background: #00d2ff; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                Color: Direction
            </button>
        </div>

        <div class="control-group" style="margin-top: 10px; text-align: center; color: #aaa; font-size: 0.85em;">
            <span id="mouseModeHint">Mouse: Attract (Click canvas to switch)</span>
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="module">
        if (!navigator.gpu) {
            alert("WebGPU not supported on this browser.");
            throw new Error("WebGPU not supported");
        }

        const canvas = document.getElementById("canvas");
        const adapter = await navigator.gpu.requestAdapter();
        const device = await adapter.requestDevice();
        const context = canvas.getContext("webgpu");
        const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

        context.configure({
            device: device,
            format: presentationFormat,
            alphaMode: "premultiplied",
        });

        const numParticles = 30000;
        const particleSize = 4 * 4; // vec2f pos, vec2f vel = 4 floats * 4 bytes

        // Grid Parameters
        const cellWidth = 0.1;
        const maxGridX = 128;
        const maxGridY = 128;
        const numCells = maxGridX * maxGridY;

        // Compute Shader
        const computeShaderCode = `
            struct Particle {
                pos: vec2f,
                vel: vec2f,
            };

            struct SimParams {
                deltaT: f32,
                rule1Distance: f32,
                rule2Distance: f32,
                rule3Distance: f32,
                rule1Scale: f32,
                rule2Scale: f32,
                rule3Scale: f32,
                colorMode: f32,
                mousePos: vec2f,
                mouseForce: f32,
                aspectRatio: f32,
                gridDimX: f32,
                gridDimY: f32,
                cellWidth: f32,
            };

            @group(0) @binding(0) var<uniform> params: SimParams;
            @group(0) @binding(1) var<storage, read> particlesA: array<Particle>;
            @group(0) @binding(2) var<storage, read_write> particlesB: array<Particle>;
            @group(0) @binding(3) var<storage, read_write> gridHeads: array<atomic<i32>>;
            @group(0) @binding(4) var<storage, read_write> gridNext: array<i32>;

            // Helper to get cell index
            fn getCellIndex(pos: vec2f) -> i32 {
                // Map [-aspect, aspect] to [0, gridDimX]
                // Map [-1, 1] to [0, gridDimY]
                // We assume the grid is centered at 0,0
                
                let gridWidth = params.gridDimX * params.cellWidth;
                let gridHeight = params.gridDimY * params.cellWidth;
                
                let x = i32(floor((pos.x + gridWidth * 0.5) / params.cellWidth));
                let y = i32(floor((pos.y + gridHeight * 0.5) / params.cellWidth));
                
                // Clamp to valid range
                let cx = clamp(x, 0, i32(params.gridDimX) - 1);
                let cy = clamp(y, 0, i32(params.gridDimY) - 1);
                
                return cy * i32(params.gridDimX) + cx;
            }

            @compute @workgroup_size(64)
            fn clearGrid(@builtin(global_invocation_id) GlobalInvocationID : vec3u) {
                let index = GlobalInvocationID.x;
                if (index >= u32(params.gridDimX * params.gridDimY)) { return; }
                atomicStore(&gridHeads[index], -1);
            }

            @compute @workgroup_size(64)
            fn updateGrid(@builtin(global_invocation_id) GlobalInvocationID : vec3u) {
                let index = GlobalInvocationID.x;
                if (index >= ${numParticles}) { return; }

                let pos = particlesA[index].pos;
                let cellIndex = getCellIndex(pos);
                
                // Atomic exchange to insert into linked list
                let next = atomicExchange(&gridHeads[cellIndex], i32(index));
                gridNext[index] = next;
            }

            @compute @workgroup_size(64)
            fn main(@builtin(global_invocation_id) GlobalInvocationID : vec3u) {
                let index = GlobalInvocationID.x;
                if (index >= ${numParticles}) { return; }

                var vPos = particlesA[index].pos;
                var vVel = particlesA[index].vel;
                
                var cCohesion = vec2f(0.0, 0.0);
                var cVel = vec2f(0.0, 0.0);
                var colVel = vec2f(0.0, 0.0);
                var cMassCount = 0u;
                var cVelCount = 0u;
                var colVelCount = 0u;

                let myCellIndex = getCellIndex(vPos);
                let gridW = i32(params.gridDimX);
                let gridH = i32(params.gridDimY);
                let myCY = myCellIndex / gridW;
                let myCX = myCellIndex % gridW;

                // Check 3x3 neighbor cells
                for (var dy = -1; dy <= 1; dy++) {
                    for (var dx = -1; dx <= 1; dx++) {
                        // Wrap cell coordinates
                        var cx = myCX + dx;
                        var cy = myCY + dy;
                        
                        // Handle wrapping for neighbor lookup
                        if (cx < 0) { cx += gridW; }
                        if (cx >= gridW) { cx -= gridW; }
                        // Y doesn't wrap in physics, but for grid lookup we clamp or wrap?
                        // Physics wraps Y too.
                        if (cy < 0) { cy += gridH; }
                        if (cy >= gridH) { cy -= gridH; }

                        let neighborCellIndex = cy * gridW + cx;
                        
                        // Traverse linked list
                        var neighborIndex = atomicLoad(&gridHeads[neighborCellIndex]);
                        var iter = 0;
                        while (neighborIndex != -1 && iter < 1000) { // Safety break
                            if (u32(neighborIndex) != index) {
                                let pos = particlesA[neighborIndex].pos;
                                let vel = particlesA[neighborIndex].vel;
                                
                                // Toroidal wrapping: Calculate shortest vector to neighbor
                                var delta = pos - vPos;
                                if (delta.x > params.aspectRatio) { delta.x -= 2.0 * params.aspectRatio; }
                                if (delta.x < -params.aspectRatio) { delta.x += 2.0 * params.aspectRatio; }
                                if (delta.y > 1.0) { delta.y -= 2.0; }
                                if (delta.y < -1.0) { delta.y += 2.0; }
                                
                                let d = length(delta);

                                // Rule 1: Separation
                                if (d < params.rule1Distance) {
                                    if (d < 0.0001) {
                                        colVel += vec2f(0.01, 0.0);
                                    } else {
                                        colVel -= normalize(delta) * params.rule1Distance;
                                    }
                                    colVelCount++;
                                }

                                // Rule 2: Alignment
                                if (d < params.rule2Distance) {
                                    cVel += vel;
                                    cVelCount++;
                                }

                                // Rule 3: Cohesion
                                if (d < params.rule3Distance) {
                                    cCohesion += delta;
                                    cMassCount++;
                                }
                            }
                            neighborIndex = gridNext[neighborIndex];
                            iter++;
                        }
                    }
                }

                if (colVelCount > 0u) {
                    vVel += colVel * params.rule1Scale;
                }

                if (cVelCount > 0u) {
                    cVel = cVel / f32(cVelCount);
                    vVel += (cVel - vVel) * params.rule2Scale;
                }

                if (cMassCount > 0u) {
                    cCohesion = cCohesion / f32(cMassCount);
                    vVel += cCohesion * params.rule3Scale;
                }

                // Mouse Influence (Wrapped)
                if (abs(params.mouseForce) > 0.0001) {
                    var deltaMouse = params.mousePos - vPos;
                    if (deltaMouse.x > params.aspectRatio) { deltaMouse.x -= 2.0 * params.aspectRatio; }
                    if (deltaMouse.x < -params.aspectRatio) { deltaMouse.x += 2.0 * params.aspectRatio; }
                    if (deltaMouse.y > 1.0) { deltaMouse.y -= 2.0; }
                    if (deltaMouse.y < -1.0) { deltaMouse.y += 2.0; }
                    
                    let dMouse = length(deltaMouse);
                    if (dMouse < 0.5 && dMouse > 0.0001) {
                        let dir = normalize(deltaMouse);
                        vVel += dir * params.mouseForce * (1.0 - dMouse / 0.5);
                    }
                }

                // Clamp velocity
                if (length(vVel) > 0.01) {
                    vVel = normalize(vVel) * 0.01;
                }

                // Update position
                vPos += vVel * params.deltaT * 100.0;

                // Wrap around screen (Seamless)
                if (vPos.x < -params.aspectRatio) { vPos.x += 2.0 * params.aspectRatio; }
                if (vPos.x > params.aspectRatio) { vPos.x -= 2.0 * params.aspectRatio; }
                if (vPos.y < -1.0) { vPos.y += 2.0; }
                if (vPos.y > 1.0) { vPos.y -= 2.0; }

                particlesB[index].pos = vPos;
                particlesB[index].vel = vVel;
            }
        `;

        // Render Shader
        const renderShaderCode = `
            struct Particle {
                pos: vec2f,
                vel: vec2f,
            };

            struct SimParams {
                deltaT: f32,
                rule1Distance: f32,
                rule2Distance: f32,
                rule3Distance: f32,
                rule1Scale: f32,
                rule2Scale: f32,
                rule3Scale: f32,
                colorMode: f32,
                mousePos: vec2f,
                mouseForce: f32,
                aspectRatio: f32,
            };

            @group(0) @binding(0) var<uniform> params: SimParams;
            @group(0) @binding(1) var<storage, read> particles: array<Particle>;

            struct VertexOutput {
                @builtin(position) position : vec4f,
                @location(0) color : vec4f,
            };

            @vertex
            fn vs(
                @builtin(vertex_index) vertexIndex : u32,
                @builtin(instance_index) instanceIndex : u32
            ) -> VertexOutput {
                let particle = particles[instanceIndex];
                
                const scale = 0.002;

                // Triangle geometry
                var pos = array<vec2f, 3>(
                    vec2f(0.0, 3*scale),  // Nose
                    vec2f(-scale, -scale), // Left wing
                    vec2f(scale, -scale)   // Right wing
                );

                // Rotate triangle to face velocity
                let angle = -atan2(particle.vel.x, particle.vel.y);
                let c = cos(angle);
                let s = sin(angle);
                let p = pos[vertexIndex];
                let rotated = vec2f(
                    p.x * c - p.y * s,
                    p.x * s + p.y * c
                );

                var output : VertexOutput;
                // Correct for aspect ratio in rendering
                // Divide X by aspectRatio to map [-aspect, aspect] to [-1, 1]
                let finalPos = particle.pos + rotated;
                output.position = vec4f(finalPos.x / params.aspectRatio, finalPos.y, 0.0, 1.0);
                
                if (params.colorMode < 0.5) {
                    // Mode 0: Direction (Cyan/Blue palette)
                    output.color = vec4f(
                        sin(angle * 1),
                        0.9,
                        cos(angle * 1),
                        1.0
                    );
                } else {
                    // Mode 1: Speed (Heatmap: Blue -> Red)
                    // Speed is clamped to 0.01 in compute, but let's normalize it relative to that max
                    let speed = length(particle.vel);
                    let nSpeed = clamp(speed / 0.01, 0.0, 1.0);
                    
                    // Simple heatmap
                    output.color = vec4f(
                        nSpeed,             // Red increases with speed
                        0.2,                // Green constant
                        1.0 - nSpeed,       // Blue decreases with speed
                        1.0
                    );
                }
                
                return output;
            }

            @fragment
            fn fs(@location(0) color : vec4f) -> @location(0) vec4f {
                return color;
            }
        `;

        // Initial Data
        const initialAspect = window.innerWidth / window.innerHeight;
        const initialParticleData = new Float32Array(numParticles * 4);
        for (let i = 0; i < numParticles; i++) {
            initialParticleData[i * 4 + 0] = (Math.random() * 2 - 1) * initialAspect; // x scaled by aspect
            initialParticleData[i * 4 + 1] = Math.random() * 2 - 1; // y
            initialParticleData[i * 4 + 2] = (Math.random() - 0.5) * 0.02; // vx
            initialParticleData[i * 4 + 3] = (Math.random() - 0.5) * 0.02; // vy
        }

        const particleBuffers = [
            device.createBuffer({
                size: initialParticleData.byteLength,
                usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
            }),
            device.createBuffer({
                size: initialParticleData.byteLength,
                usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
            }),
        ];

        // Grid Buffers
        const gridHeadsBuffer = device.createBuffer({
            size: numCells * 4, // i32
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        });

        const gridNextBuffer = device.createBuffer({
            size: numParticles * 4, // i32
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        });

        device.queue.writeBuffer(particleBuffers[0], 0, initialParticleData);
        device.queue.writeBuffer(particleBuffers[1], 0, initialParticleData);

        // Uniform Buffer
        const simParams = {
            deltaT: 0.008, // speed of simulation
            rule1Distance: 0.02, // separation radius
            rule2Distance: 0.03, // alignment radius
            rule3Distance: 0.07, // cohesion radius
            rule1Scale: 0.044, // separation force
            rule2Scale: 0.035, // alignment force
            rule3Scale: 0.034, // cohesion force
            colorMode: 1.0, // 0 = Direction, 1 = Speed
            mousePos: [0, 0], // vec2f
            mouseForce: 0.0, // 0 = None, >0 = Attract, <0 = Repel
            aspectRatio: initialAspect,
            gridDimX: 0, // Set in frame()
            gridDimY: 0, // Set in frame()
            cellWidth: cellWidth,
        };

        // UI Logic
        function setupUI() {
            const inputs = [
                'deltaT',
                'rule1Distance', 'rule1Scale',
                'rule2Distance', 'rule2Scale',
                'rule3Distance', 'rule3Scale'
            ];

            inputs.forEach(id => {
                const el = document.getElementById(id);
                const valDisplay = document.getElementById('val-' + id);

                // Set initial values from simParams
                el.value = simParams[id];
                valDisplay.innerText = simParams[id].toFixed(id.includes('Scale') || id === 'deltaT' ? 3 : 2);

                el.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    simParams[id] = val;
                    valDisplay.innerText = val.toFixed(id.includes('Scale') || id === 'deltaT' ? 3 : 2);
                });
            });

            // Color Mode Toggle Button
            const colorModeBtn = document.getElementById('colorModeBtn');
            const modes = ['Direction', 'Speed'];

            // Initialize button state
            function updateColorBtn() {
                colorModeBtn.innerText = `Color: ${modes[simParams.colorMode]}`;
                if (simParams.colorMode === 0) {
                    colorModeBtn.style.background = '#00d2ff'; // Cyan for Direction
                    colorModeBtn.style.color = 'black';
                } else {
                    colorModeBtn.style.background = '#ff4444'; // Red for Speed
                    colorModeBtn.style.color = 'white';
                }
            }
            updateColorBtn();

            colorModeBtn.addEventListener('click', () => {
                simParams.colorMode = (simParams.colorMode + 1) % 2;
                updateColorBtn();
            });

            // Mouse Mode Logic
            const mouseModeHint = document.getElementById('mouseModeHint');
            const mouseModes = [
                { name: 'None', force: 0.0, color: '#aaa' },
                { name: 'Attract', force: 0.002, color: '#00ff00' },
                { name: 'Repel', force: -0.005, color: '#ff4444' }
            ];

            // Find initial mode index based on force
            let currentMouseMode = 0;
            if (simParams.mouseForce > 0) currentMouseMode = 1;
            else if (simParams.mouseForce < 0) currentMouseMode = 2;

            function updateMouseHint() {
                const mode = mouseModes[currentMouseMode];
                mouseModeHint.innerHTML = `Mouse: <span style="color: ${mode.color}; font-weight: bold;">${mode.name}</span> (Click canvas to switch)`;
            }
            updateMouseHint();

            // Switch mode on canvas click
            canvas.addEventListener('click', () => {
                currentMouseMode = (currentMouseMode + 1) % 3;
                const mode = mouseModes[currentMouseMode];
                simParams.mouseForce = mode.force;
                updateMouseHint();
            });

            // Mouse Position Tracking
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Convert to NDC [-1, 1]
                // Use rect.width/height (CSS pixels) for normalization, not canvas.width/height (physical pixels)
                // Scale X by aspect ratio to match simulation space
                const aspect = canvas.width / canvas.height;
                simParams.mousePos[0] = ((x / rect.width) * 2 - 1) * aspect;
                simParams.mousePos[1] = (1.0 - y / rect.height) * 2 - 1; // Flip Y for WebGPU/NDC
            });
        }
        setupUI();

        const uniformBufferSize = 64; // 16 floats -> 64 bytes
        const uniformBuffer = device.createBuffer({
            size: uniformBufferSize,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });

        // Create explicit BindGroupLayout that all pipelines will share
        const bindGroupLayout = device.createBindGroupLayout({
            entries: [
                { binding: 0, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
                { binding: 1, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
                { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
                { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
                { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
            ]
        });

        // Create explicit PipelineLayout
        const pipelineLayout = device.createPipelineLayout({
            bindGroupLayouts: [bindGroupLayout]
        });

        // Pipelines
        const computeModule = device.createShaderModule({ code: computeShaderCode });
        const renderModule = device.createShaderModule({ code: renderShaderCode });

        const clearGridPipeline = device.createComputePipeline({
            layout: pipelineLayout,
            compute: { module: computeModule, entryPoint: 'clearGrid' },
        });

        const updateGridPipeline = device.createComputePipeline({
            layout: pipelineLayout,
            compute: { module: computeModule, entryPoint: 'updateGrid' },
        });

        const computePipeline = device.createComputePipeline({
            layout: pipelineLayout,
            compute: { module: computeModule, entryPoint: 'main' },
        });

        const renderPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: renderModule, entryPoint: 'vs' },
            fragment: { module: renderModule, entryPoint: 'fs', targets: [{ format: presentationFormat }] },
            primitive: { topology: 'triangle-list' },
        });

        // Bind Groups using explicit layout
        const bindGroups = [
            device.createBindGroup({
                layout: bindGroupLayout,
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: { buffer: particleBuffers[0] } },
                    { binding: 2, resource: { buffer: particleBuffers[1] } },
                    { binding: 3, resource: { buffer: gridHeadsBuffer } },
                    { binding: 4, resource: { buffer: gridNextBuffer } },
                ],
            }),
            device.createBindGroup({
                layout: bindGroupLayout,
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: { buffer: particleBuffers[1] } },
                    { binding: 2, resource: { buffer: particleBuffers[0] } },
                    { binding: 3, resource: { buffer: gridHeadsBuffer } },
                    { binding: 4, resource: { buffer: gridNextBuffer } },
                ],
            }),
        ];

        let t = 0;

        function frame() {
            const aspect = canvas.width / canvas.height;
            simParams.aspectRatio = aspect;

            // Update Grid Dimensions
            // World Y is -1 to 1 (size 2.0). X is -aspect to aspect (size 2.0 * aspect).
            simParams.gridDimX = Math.ceil((aspect * 2.0) / simParams.cellWidth);
            simParams.gridDimY = Math.ceil(2.0 / simParams.cellWidth);

            // Clamp to max grid size
            if (simParams.gridDimX > maxGridX) simParams.gridDimX = maxGridX;
            if (simParams.gridDimY > maxGridY) simParams.gridDimY = maxGridY;

            const uniformData = new Float32Array([
                simParams.deltaT,
                simParams.rule1Distance,
                simParams.rule2Distance,
                simParams.rule3Distance,
                simParams.rule1Scale,
                simParams.rule2Scale,
                simParams.rule3Scale,
                simParams.colorMode,
                simParams.mousePos[0],
                simParams.mousePos[1],
                simParams.mouseForce,
                simParams.aspectRatio,
                simParams.gridDimX,
                simParams.gridDimY,
                simParams.cellWidth,
                0 // Padding to 64 bytes
            ]);
            device.queue.writeBuffer(uniformBuffer, 0, uniformData);

            const commandEncoder = device.createCommandEncoder();
            const bindGroup = bindGroups[t % 2];

            // Pass 1: Clear Grid
            const clearPass = commandEncoder.beginComputePass();
            clearPass.setPipeline(clearGridPipeline);
            clearPass.setBindGroup(0, bindGroup);
            clearPass.dispatchWorkgroups(Math.ceil(numCells / 64));
            clearPass.end();

            // Pass 2: Update Grid (Binning)
            const updateGridPass = commandEncoder.beginComputePass();
            updateGridPass.setPipeline(updateGridPipeline);
            updateGridPass.setBindGroup(0, bindGroup);
            updateGridPass.dispatchWorkgroups(Math.ceil(numParticles / 64));
            updateGridPass.end();

            // Pass 3: Main Simulation
            const computePass = commandEncoder.beginComputePass();
            computePass.setPipeline(computePipeline);
            computePass.setBindGroup(0, bindGroup);
            computePass.dispatchWorkgroups(Math.ceil(numParticles / 64));
            computePass.end();

            // Render Pass
            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    clearValue: { r: 0.02, g: 0.02, b: 0.05, a: 1 },
                    loadOp: 'clear',
                    storeOp: 'store',
                }],
            });
            renderPass.setPipeline(renderPipeline);

            const renderBindGroup = device.createBindGroup({
                layout: renderPipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: { buffer: particleBuffers[(t + 1) % 2] } }
                ],
            });

            renderPass.setBindGroup(0, renderBindGroup);
            renderPass.draw(3, numParticles);
            renderPass.end();

            device.queue.submit([commandEncoder.finish()]);

            t++;
            requestAnimationFrame(frame);
        }

        // Resize handling
        function onResize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
        }
        window.addEventListener('resize', onResize);
        onResize();

        frame();
    </script>
