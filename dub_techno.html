<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dub Techno Generator - Ryōji Ikeda Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            transition: opacity 0.5s;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        button:hover {
            background: #ccc;
        }

        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            display: flex;
            gap: 20px;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            height: 2px;
            width: 150px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <h1>DUB TECHNO GENERATOR</h1>
        <p>WebAudio + WebGPU (Ikeda Style)</p>
        <button id="btn-start">Initialize System</button>
    </div>

    <div id="ui">
        <div class="control">
            <label>Chord Filter</label>
            <input type="range" id="p-filter" min="100" max="3000" value="400">
        </div>
        <div class="control">
            <label>Delay Feedback</label>
            <input type="range" id="p-delay" min="0" max="0.9" step="0.01" value="0.6">
        </div>
        <div class="control">
            <label>Reverb Level</label>
            <input type="range" id="p-reverb" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <canvas id="gpuCanvas"></canvas>

    <script type="module">
        // --- AUDIO ENGINE ---
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.master = null;
                this.analyser = null;
                this.nextNoteTime = 0;
                this.tempo = 118;
                this.lookahead = 25.0;
                this.scheduleAheadTime = 0.1;
                this.timerID = null;
                this.isPlaying = false;
                this.current16thNote = 0;

                // Params
                this.chordFilterFreq = 400;
                this.delayFeedback = 0.6;
                this.reverbLevel = 0.5;

                // Chord Progression
                this.currentProgressionIndex = 0; // Which progression (C minor, D minor, etc.)
                this.currentChordIndex = 0; // Which chord within the progression
                this.nextChordChange = this.getNextChordChange(); // When to change chord
                this.nextProgressionChange = 64 + Math.floor(Math.random() * 32); // When to change progression (64-95 bars)
                this.currentBar = 0;

                // Dub techno chord progressions (minor keys)
                this.chordProgressions = [
                    // C minor: Cm, Fm, Ab, Bb
                    [[130.81, 155.56, 196.00], [174.61, 207.65, 261.63], [207.65, 246.94, 311.13], [233.08, 277.18, 349.23]],
                    // D minor: Dm, Gm, Bb, C
                    [[146.83, 174.61, 220.00], [196.00, 233.08, 293.66], [233.08, 277.18, 349.23], [261.63, 311.13, 392.00]],
                    // E minor: Em, Am, C, D
                    [[164.81, 196.00, 246.94], [220.00, 261.63, 329.63], [261.63, 311.13, 392.00], [293.66, 349.23, 440.00]],
                    // A minor: Am, Dm, F, G
                    [[220.00, 261.63, 329.63], [146.83, 174.61, 220.00], [174.61, 207.65, 261.63], [196.00, 233.08, 293.66]]
                ];
            }

            getNextChordChange() {
                // Returns the number of bars to until the next chord change
                return 2 ** Math.floor(Math.random() * 5); // 1, 2, 4, 8, 16
            }

            async init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.master = this.ctx.createGain();
                this.master.gain.value = 0.8;

                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 2048;
                this.master.connect(this.analyser);
                this.analyser.connect(this.ctx.destination);

                await this.setupEffects();
            }

            async setupEffects() {
                this.delayInput = this.ctx.createGain();
                this.delayNodeL = this.ctx.createDelay();
                this.delayNodeR = this.ctx.createDelay();
                this.delayFeedbackL = this.ctx.createGain();
                this.delayFeedbackR = this.ctx.createGain();
                this.delayFilter = this.ctx.createBiquadFilter();
                this.delayOutput = this.ctx.createGain();

                const delayTime = (60 / this.tempo) * 0.75;
                this.delayNodeL.delayTime.value = delayTime;
                this.delayNodeR.delayTime.value = delayTime + 0.01;

                this.delayFilter.type = 'lowpass';
                this.delayFilter.frequency.value = 1200;
                this.delayFilter.Q.value = 0.5;

                this.delayInput.connect(this.delayNodeL);
                this.delayInput.connect(this.delayNodeR);

                this.delayNodeL.connect(this.delayFeedbackL);
                this.delayFeedbackL.connect(this.delayNodeR);
                this.delayFeedbackL.connect(this.delayOutput);

                this.delayNodeR.connect(this.delayFeedbackR);
                this.delayFeedbackR.connect(this.delayNodeL);
                this.delayFeedbackR.connect(this.delayOutput);

                this.delayFeedbackL.gain.value = this.delayFeedback;
                this.delayFeedbackR.gain.value = this.delayFeedback;

                this.delayOutput.connect(this.master);

                this.reverbNode = this.ctx.createConvolver();
                this.reverbGain = this.ctx.createGain();
                this.reverbGain.gain.value = this.reverbLevel;

                const rate = this.ctx.sampleRate;
                const length = rate * 3.0;
                const decay = 2.0;
                const impulse = this.ctx.createBuffer(2, length, rate);
                const impL = impulse.getChannelData(0);
                const impR = impulse.getChannelData(1);

                for (let i = 0; i < length; i++) {
                    const n = length - i;
                    const env = Math.pow(n / length, decay);
                    impL[i] = (Math.random() * 2 - 1) * env;
                    impR[i] = (Math.random() * 2 - 1) * env;
                }
                this.reverbNode.buffer = impulse;

                this.reverbNode.connect(this.reverbGain);
                this.reverbGain.connect(this.master);
            }

            triggerKick(time) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(50, time + 0.1);
                gain.gain.setValueAtTime(1.0, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
                osc.connect(gain);
                gain.connect(this.master);
                osc.start(time);
                osc.stop(time + 0.5);
            }

            triggerChord(time, applyFilterSpike = false) {
                // Use current chord from progression
                const progression = this.chordProgressions[this.currentProgressionIndex % this.chordProgressions.length];
                const freqs = progression[this.currentChordIndex % progression.length];
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';

                if (applyFilterSpike) {
                    // Filter spike: sweep from current freq up to 4x, then back down
                    const baseFreq = this.chordFilterFreq;
                    const peakFreq = Math.min(baseFreq * 4, 12000);

                    filter.frequency.setValueAtTime(baseFreq, time);
                    filter.frequency.exponentialRampToValueAtTime(peakFreq, time + 0.1);
                    filter.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, time + 0.3);
                    filter.Q.value = 2.0; // Higher resonance for spike
                } else {
                    // Normal filter behavior
                    filter.frequency.setValueAtTime(this.chordFilterFreq, time);
                    filter.frequency.exponentialRampToValueAtTime(this.chordFilterFreq * 0.5, time + 0.2);
                    filter.Q.value = 1.0;
                }
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.4, time + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.6);
                freqs.forEach(f => {
                    const osc = this.ctx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.value = f;
                    osc.connect(filter);
                    osc.start(time);
                    osc.stop(time + 0.6);
                });
                filter.connect(gain);
                gain.connect(this.master);
                gain.connect(this.delayInput);
                gain.connect(this.reverbNode);
            }

            triggerNoise(time) {
                const bufferSize = this.ctx.sampleRate * 0.1;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 3000 + Math.random() * 2000;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.1, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.master);
                gain.connect(this.reverbNode);
                noise.start(time);
            }

            scheduler() {
                while (this.nextNoteTime < this.ctx.currentTime + this.scheduleAheadTime) {
                    this.scheduleNote(this.current16thNote, this.nextNoteTime);
                    this.nextNote();
                }
                this.timerID = window.setTimeout(this.scheduler.bind(this), this.lookahead);
            }

            nextNote() {
                const secondsPerBeat = 60.0 / this.tempo;
                this.nextNoteTime += 0.25 * secondsPerBeat;
                this.current16thNote++;
                if (this.current16thNote === 16) {
                    this.current16thNote = 0;
                    this.currentBar++;

                    // Check for chord change
                    if (this.currentBar >= this.nextChordChange) {
                        this.currentBar = 0;
                        this.currentChordIndex++;
                        this.nextChordChange = this.getNextChordChange();

                        // Check if we should also change the progression
                        if (this.currentChordIndex >= this.nextProgressionChange) {
                            this.currentProgressionIndex = Math.floor(Math.random() * this.chordProgressions.length);
                            this.currentChordIndex = 0;
                            this.nextProgressionChange = this.currentChordIndex + 64 + Math.floor(Math.random() * 32);
                        }
                    }
                }
            }

            scheduleNote(beatNumber, time) {
                // Kick on every 4th 16th note
                if (this.current16thNote % 4 === 0) {
                    this.triggerKick(time);
                }

                // Chords with occasional filter spike
                if (Math.random() > 0.75 && this.current16thNote % 4 !== 0) {
                    const shouldSpike = Math.random() > 0.95; // 5% chance of filter spike
                    this.triggerChord(time, shouldSpike);
                }

                if (Math.random() > 0.5) this.triggerNoise(time);
            }

            start() {
                if (this.isPlaying) return;
                this.isPlaying = true;
                this.current16thNote = 0;
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.scheduler();
            }

            updateParams(filter, delay, reverb) {
                this.chordFilterFreq = filter;
                this.delayFeedback = delay;
                this.reverbLevel = reverb;
                if (this.delayFeedbackL) {
                    this.delayFeedbackL.gain.setTargetAtTime(this.delayFeedback, this.ctx.currentTime, 0.1);
                    this.delayFeedbackR.gain.setTargetAtTime(this.delayFeedback, this.ctx.currentTime, 0.1);
                }
                if (this.reverbGain) {
                    this.reverbGain.gain.setTargetAtTime(this.reverbLevel, this.ctx.currentTime, 0.1);
                }
            }
        }

        // --- VISUALIZER (WebGPU - Ryōji Ikeda Style) ---
        class Visualizer {
            constructor() {
                this.canvas = document.getElementById('gpuCanvas');
                this.adapter = null;
                this.device = null;
                this.context = null;
                this.pipeline = null;

                this.uniformBuffer = null;
                this.audioBuffer = null;
                this.audioData = new Uint8Array(1024);
            }

            async init() {
                if (!navigator.gpu) throw new Error("WebGPU not supported");
                this.adapter = await navigator.gpu.requestAdapter();
                this.device = await this.adapter.requestDevice();
                this.context = this.canvas.getContext('webgpu');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                await this.createResources();
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = window.innerWidth * dpr;
                this.canvas.height = window.innerHeight * dpr;
                this.context.configure({
                    device: this.device,
                    format: navigator.gpu.getPreferredCanvasFormat(),
                    alphaMode: 'premultiplied'
                });
            }

            async createResources() {
                // 1. Audio Buffer (Storage)
                this.audioBuffer = this.device.createBuffer({
                    size: 1024, // 256 floats * 4
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
                });

                // 2. Uniforms
                this.uniformBuffer = this.device.createBuffer({
                    size: 16, // time(f32), res(vec2), padding
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
                });

                // 3. Shader Module
                const shaderModule = this.device.createShaderModule({
                    code: `
                    struct Uniforms {
                        time : f32,
                        resolution : vec2<f32>
                    };
                    
                    @group(0) @binding(0) var<storage, read> audioData : array<f32>;
                    @group(0) @binding(1) var<uniform> uniforms : Uniforms;

                    struct VertexOutput {
                        @builtin(position) position : vec4<f32>,
                        @location(0) uv : vec2<f32>
                    };

                    @vertex
                    fn vs_main(@builtin(vertex_index) vertexIndex : u32) -> VertexOutput {
                        var pos = array<vec2<f32>, 6>(
                            vec2<f32>(-1.0, -1.0), vec2<f32>(1.0, -1.0), vec2<f32>(-1.0, 1.0),
                            vec2<f32>(-1.0, 1.0), vec2<f32>(1.0, -1.0), vec2<f32>(1.0, 1.0)
                        );
                        var output : VertexOutput;
                        output.position = vec4<f32>(pos[vertexIndex], 0.0, 1.0);
                        output.uv = pos[vertexIndex] * 0.5 + 0.5;
                        return output;
                    }

                    fn rand(n: vec2<f32>) -> f32 {
                        return fract(sin(dot(n, vec2<f32>(12.9898, 4.1414))) * 43758.5453);
                    }

                    fn getAudio(freq: f32) -> f32 {
                        let index = u32(freq * 255.0);
                        return audioData[min(index, 255u)];
                    }
                    
                    // 7-segment display digit (0-9)
                    fn getDigit(n: u32, p: vec2<f32>) -> f32 {
                        // p is in 0..1 range for the digit cell
                        let segments = array<u32, 10>(
                            0x7Eu, 0x30u, 0x6Du, 0x79u, 0x33u, // 0-4
                            0x5Bu, 0x5Fu, 0x70u, 0x7Fu, 0x7Bu  // 5-9
                        );
                        
                        if (n > 9u) { return 0.0; }
                        let seg = segments[n];
                        
                        // Define segment positions (simplified 7-seg)
                        var lit = 0.0;
                        if (p.y > 0.8 && p.x > 0.2 && p.x < 0.8 && (seg & 0x01u) != 0u) { lit = 1.0; } // top
                        if (p.y < 0.2 && p.x > 0.2 && p.x < 0.8 && (seg & 0x40u) != 0u) { lit = 1.0; } // bottom
                        if (p.x > 0.8 && p.y > 0.5 && (seg & 0x02u) != 0u) { lit = 1.0; } // top-right
                        if (p.x > 0.8 && p.y < 0.5 && (seg & 0x04u) != 0u) { lit = 1.0; } // bottom-right
                        if (p.x < 0.2 && p.y < 0.5 && (seg & 0x08u) != 0u) { lit = 1.0; } // bottom-left
                        if (p.x < 0.2 && p.y > 0.5 && (seg & 0x10u) != 0u) { lit = 1.0; } // top-left
                        if (p.y > 0.4 && p.y < 0.6 && p.x > 0.2 && p.x < 0.8 && (seg & 0x20u) != 0u) { lit = 1.0; } // middle
                        
                        return lit;
                    }
                    
                    // Display a number (0-999)
                    fn displayNumber(num: u32, uv: vec2<f32>, pos: vec2<f32>, scale: f32) -> f32 {
                        let localUV = (uv - pos) / scale;
                        if (localUV.x < 0.0 || localUV.x > 3.0 || localUV.y < 0.0 || localUV.y > 1.0) {
                            return 0.0;
                        }
                        
                        let digitIdx = u32(floor(localUV.x));
                        let digitUV = fract(localUV.x);
                        
                        var digit = 0u;
                        if (digitIdx == 0u) { digit = (num / 100u) % 10u; }
                        else if (digitIdx == 1u) { digit = (num / 10u) % 10u; }
                        else { digit = num % 10u; }
                        
                        return getDigit(digit, vec2<f32>(digitUV, localUV.y));
                    }

                    @fragment
                    fn fs_main(@location(0) uv : vec2<f32>) -> @location(0) vec4<f32> {
                        var color = vec3<f32>(0.0);
                        let time = uniforms.time;
                        
                        // Split screen into zones (Ikeda style)
                        
                        // Zone 1: Top Barcode (High Freqs) + Numeric Data
                        if (uv.y > 0.6) {
                            let bars = 100.0;
                            let idx = floor(uv.x * bars);
                            let freq = idx / bars;
                            let val = getAudio(freq);
                            
                            // Thresholding for stark contrast
                            if (val > 0.1 && rand(vec2<f32>(idx, floor(time * 20.0))) > 0.5) {
                                color = vec3<f32>(1.0);
                            }
                            
                            // Scanline
                            if (abs(uv.x - fract(time * 0.5)) < 0.002) {
                                color = vec3<f32>(1.0) - color; // Invert
                            }
                            
                            // Single large marquee row
                            let numY = (uv.y - 0.6) / 0.4;
                            if (numY > 0.15 && numY < 0.85) {
                                let scrollSpeed = 0.4;
                                let direction = 1.0;
                                
                                let scrollOffset = fract(time * scrollSpeed) * direction;
                                let numX = floor((uv.x + scrollOffset) * 6.0);
                                let freqVal = u32(getAudio(fract(numX / 6.0)) * 999.0);
                                
                                let localX = fract((uv.x + scrollOffset) * 6.0);
                                // Larger scale (0.16 instead of 0.1)
                                let numDisp = displayNumber(freqVal, vec2<f32>(localX, (numY - 0.15) / 0.7), vec2<f32>(0.0, 0.0), 0.16);
                                
                                if (numDisp > 0.5) {
                                    color = vec3<f32>(1.0);
                                }
                            }
                        } 
                        // Zone 2: Middle Grid (Mid Freqs) + Data Matrix
                        else if (uv.y > 0.3) {
                            let gridX = 50.0;
                            let gridY = 10.0;
                            let cx = floor(uv.x * gridX);
                            let cy = floor(uv.y * gridY);
                            
                            let freq = cx / gridX;
                            let val = getAudio(freq * 0.5); // Lower freqs
                            
                            if (val > 0.2 + (cy/gridY)*0.5) {
                                color = vec3<f32>(1.0);
                            }
                            
                            // Grid lines
                            if (fract(uv.x * gridX) < 0.1 || fract(uv.y * gridY) < 0.1) {
                                color = vec3<f32>(0.0);
                            }
                            
                            // Marquee numbers in rows with varying speeds/directions
                            let midY = (uv.y - 0.3) / 0.3;
                            let rowIdx = floor(midY * 6.0); // 6 rows
                            let rowY = fract(midY * 6.0);
                            
                            // Vary speed, direction, and digit count per row
                            var speed = 0.0;
                            var dir = 1.0;
                            var maxVal = 0.0;
                            if (rowIdx == 0.0) { speed = 0.4; dir = 1.0; maxVal = 99.0; }      // 2 digits
                            else if (rowIdx == 1.0) { speed = 0.6; dir = -1.0; maxVal = 999.0; }  // 3 digits
                            else if (rowIdx == 2.0) { speed = 0.3; dir = 1.0; maxVal = 9.0; }     // 1 digit
                            else if (rowIdx == 3.0) { speed = 0.8; dir = -1.0; maxVal = 999.0; }  // 3 digits
                            else if (rowIdx == 4.0) { speed = 0.5; dir = 1.0; maxVal = 99.0; }    // 2 digits
                            else { speed = 1.0; dir = -1.0; maxVal = 9.0; }                       // 1 digit
                            
                            let scroll = fract(time * speed + rowIdx * 0.3) * dir;
                            let numIdx = floor((uv.x + scroll) * 8.0);
                            let cellNum = u32(rand(vec2<f32>(numIdx, rowIdx + floor(time * speed))) * maxVal);
                            
                            let localX = fract((uv.x + scroll) * 8.0);
                            let numDisp = displayNumber(cellNum, vec2<f32>(localX, rowY), vec2<f32>(0.0, 0.0), 0.12);
                            
                            if (numDisp > 0.5) {
                                color = vec3<f32>(1.0) - color; // Invert for contrast
                            }
                        }
                        // Zone 3: Bottom Data Stream (Low Freqs / Raw) + Binary/Hex
                        else {
                            let bars = 200.0;
                            let idx = floor(uv.x * bars);
                            let val = getAudio(uv.x * 0.2); // Bass
                            
                            if (val > 0.5) {
                                color = vec3<f32>(1.0);
                            }
                            
                            // Glitch offset
                            if (rand(vec2<f32>(0.0, floor(time * 60.0))) > 0.9) {
                                color = vec3<f32>(1.0) - color;
                            }
                            
                            // Marquee rows with different speeds, directions, and digit counts
                            let numRows = 4.0;
                            let rowIdx = floor(uv.y * numRows / 0.3);
                            let rowY = fract(uv.y * numRows / 0.3);
                            
                            // Each row has unique speed, direction, and max value (digit count)
                            var scrollSpeed = 0.0;
                            var direction = 1.0;
                            var maxValue = 0.0;
                            if (rowIdx == 0.0) { scrollSpeed = 1.5; direction = 1.0; maxValue = 9999.0; }   // 4 digits
                            else if (rowIdx == 1.0) { scrollSpeed = 2.3; direction = -1.0; maxValue = 99.0; }    // 2 digits
                            else if (rowIdx == 2.0) { scrollSpeed = 0.8; direction = 1.0; maxValue = 999.0; }   // 3 digits
                            else { scrollSpeed = 3.0; direction = -1.0; maxValue = 9.0; }                       // 1 digit
                            
                            let scroll = fract(time * scrollSpeed) * direction;
                            let numIdx = floor((uv.x + scroll) * 12.0);
                            let dataNum = u32(rand(vec2<f32>(numIdx, rowIdx + floor(time * scrollSpeed))) * maxValue);
                            
                            let localX = fract((uv.x + scroll) * 12.0);
                            let dataDisp = displayNumber(dataNum, vec2<f32>(localX, rowY), vec2<f32>(0.0, 0.0), 0.083);
                            
                            if (dataDisp > 0.5) {
                                color = vec3<f32>(1.0);
                            }
                        }
                        
                        // Global Glitch
                        if (rand(vec2<f32>(0.0, floor(time * 10.0))) > 0.98) {
                            color = vec3<f32>(1.0) - color;
                        }

                        return vec4<f32>(color, 1.0);
                    }
                    `
                });

                // Pipeline
                this.pipeline = this.device.createRenderPipeline({
                    layout: 'auto',
                    vertex: { module: shaderModule, entryPoint: 'vs_main' },
                    fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format: navigator.gpu.getPreferredCanvasFormat() }] },
                    primitive: { topology: 'triangle-list' }
                });

                this.bindGroup = this.device.createBindGroup({
                    layout: this.pipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: { buffer: this.audioBuffer } },
                        { binding: 1, resource: { buffer: this.uniformBuffer } }
                    ]
                });
            }

            render(time, analyser) {
                if (!this.device || !this.pipeline) return;

                // 1. Update Audio
                analyser.getByteFrequencyData(this.audioData);
                const floatAudio = new Float32Array(256);
                for (let i = 0; i < 256; i++) floatAudio[i] = this.audioData[i] / 255.0;
                this.device.queue.writeBuffer(this.audioBuffer, 0, floatAudio);

                // 2. Update Uniforms
                const uniforms = new Float32Array([time, this.canvas.width, this.canvas.height, 0]);
                this.device.queue.writeBuffer(this.uniformBuffer, 0, uniforms);

                const commandEncoder = this.device.createCommandEncoder();
                const passEncoder = commandEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: this.context.getCurrentTexture().createView(),
                        clearValue: { r: 0, g: 0, b: 0, a: 1 },
                        loadOp: 'clear', storeOp: 'store'
                    }]
                });

                passEncoder.setPipeline(this.pipeline);
                passEncoder.setBindGroup(0, this.bindGroup);
                passEncoder.draw(6);
                passEncoder.end();

                this.device.queue.submit([commandEncoder.finish()]);
            }
        }

        // --- MAIN ---
        const audio = new AudioEngine();
        const visualizer = new Visualizer();

        const btnStart = document.getElementById('btn-start');
        const overlay = document.getElementById('overlay');

        btnStart.onclick = async () => {
            await audio.init();
            await visualizer.init();
            audio.start();
            overlay.classList.add('hidden');
            loop();
        };

        // UI Controls
        const pFilter = document.getElementById('p-filter');
        const pDelay = document.getElementById('p-delay');
        const pReverb = document.getElementById('p-reverb');

        function updateAudioParams() {
            audio.updateParams(
                parseFloat(pFilter.value),
                parseFloat(pDelay.value),
                parseFloat(pReverb.value)
            );
        }

        pFilter.oninput = updateAudioParams;
        pDelay.oninput = updateAudioParams;
        pReverb.oninput = updateAudioParams;

        // Fullscreen toggle on click (but not on UI elements)
        document.addEventListener('click', (e) => {
            // Don't toggle fullscreen if clicking on UI controls
            if (e.target.closest('#ui') || e.target.closest('#overlay')) {
                return;
            }

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Error attempting to enable fullscreen:', err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        function loop(time) {
            visualizer.render(time * 0.001, audio.analyser);
            requestAnimationFrame(loop);
        }
    </script>
</body>

</html>
